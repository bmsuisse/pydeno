# Hack pydeno. Run:  SECRET="$(openssl rand -hex 16)" docker compose up --build
#
# EGRESS: block outbound traffic at the network layer (host firewall / network policy / a
# provider security group). The sandbox already denies sockets to the guest, but the container
# itself should be unable to reach the internet or your internal network, so a win cannot
# become a pivot. Put a TLS reverse proxy in front; the server speaks plain HTTP.
#
# Seccomp: the sandbox applies its own Landlock + seccomp filter inside the worker. Keep Docker's
# default seccomp profile on (never seccomp:unconfined). If the worker cannot start with
# sandbox="require" under your runtime, requests fail closed with an error.
services:
  hack:
    build: .
    ports:
      - "127.0.0.1:8080:8080"   # bind to localhost; expose via a reverse proxy
    environment:
      SECRET: ${SECRET:?set SECRET to a throwaway value}
    read_only: true
    tmpfs:
      - /tmp
      - /run/hack:uid=10001,mode=0700   # secret.txt is written here at start-up
      - /var/log/hack:uid=10001,mode=0700,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
