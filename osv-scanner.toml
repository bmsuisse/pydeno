# pyo3 0.27.2: out-of-bounds read in `nth`/`nth_back` on PyList/PyTuple iterators. pydeno's `src/` never
# calls `.nth()` or `.nth_back()`. The fix needs pyo3 >= 0.29, which `pyo3-async-runtimes` 0.27 blocks.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0176"
reason = "affected API (PyList/PyTuple nth/nth_back) is not called; fix needs pyo3 0.29, blocked by pyo3-async-runtimes"

