# OSV scanner policy. Mirrors the reasoned exceptions in deny.toml (cargo-deny/cargo-audit read that file;
# OSV does not), so one assessment is recorded in one place per tool and CI is red only for NEW findings.
# Remove each entry when the dependency that blocks it is upgraded.

# `paste` 1.0.15 is unmaintained (no CVE, no fix). It is a build-time proc-macro pulled in by the `v8` crate,
# so it never runs in the shipped extension.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = "unmaintained build-time proc-macro dependency of the v8 crate; not present at runtime"
