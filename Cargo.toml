[package]
name = "pydeno"
version = "0.4.1"
edition = "2021"
repository = "https://github.com/bmsuisse/pydeno"
license = "MIT"
description = "Modern embedded JavaScript runtime for Python powered by V8 and Rust."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_pydeno"            # Python import name
crate-type = ["cdylib", "rlib"] # rlib so benches/ can link the crate directly

[dependencies]
anyhow = "1.0"
deno_core = "0.409.0"
deno_error = "0.7.0"
fastwebsockets = { version = "0.10.0", features = ["upgrade", "unstable-split"] }
futures = "0.3"
http = "1.3"
http-body-util = "0.1.3"
hyper = { version = "1.6.0", features = ["full"] }
hyper-util = { version = "0.1.10", features = ["tokio", "server", "server-auto"] }
indexmap = { version = "2.12.0", features = ["serde"] }
log = "0.4.28"
num-bigint = { version = "0.4", features = ["serde"] }
# extension-module is enabled by maturin (see pyproject.toml [tool.maturin]),
# not here, so the "bench" feature can enable auto-initialize instead for benches/.
pyo3 = { version = "0.27.0", features = ["num-bigint"] }
pyo3-async-runtimes = { version = "0.27", features = ["attributes", "tokio-runtime"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
tokio = { version = "1.42.0", features = ["rt", "macros", "time", "sync", "net"] }
uuid = { version = "1.16.0", features = ["v4"] }

[build-dependencies]
pyo3-build-config = "0.25.1"

[dev-dependencies]
criterion = "0.5"

[features]
# auto-initialize embeds a Python interpreter for the Criterion benches, since
# extension-module (used for the real wheel) forbids Python::with_gil.
bench = ["pyo3/auto-initialize"]

[[bench]]
name = "runtime_benches"
harness = false
required-features = ["bench"]

# Overflow checks stay ON for pydeno's own code -- they are worth having -- but
# are turned off for third-party crates in unoptimized builds.
#
# `deno_core` 0.409.0 `source_map.rs:105` computes `line_number - 1` on a
# u32 that it documents as 1-based, and V8 reports line/column 0 for some
# syntax errors. So `rt.eval("`\\")` -- an unterminated template literal --
# panics with "attempt to subtract with overflow" inside
# `JsError::from_v8_exception`, killing the runtime thread and turning a
# catchable `JavaScriptError` into `RuntimeError: Failed to receive eval
# result`. pydeno cannot fix that arithmetic, and the release build users
# actually get wraps instead of panicking, so a debug-only panic in a
# dependency is not a bug this project can act on -- it just makes the debug
# test suite unrunnable. Found by the new debug pytest job; pre-existing on
# `main`, and previously hidden because the suite died before reaching the
# fuzz test that generates that input.
#
# Scoped to `package."*"`, which in Cargo means dependencies and *not* the
# local crate, so an overflow in pydeno's own arithmetic still panics loudly.
# Remove both sections once `deno_core` is bumped past the fix.
[profile.dev.package."*"]
overflow-checks = false

[profile.test.package."*"]
overflow-checks = false
