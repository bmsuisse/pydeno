[package]
name = "pydeno"
version = "0.10.0"
edition = "2021"
repository = "https://github.com/bmsuisse/pydeno"
license = "MIT"
description = "Modern embedded JavaScript runtime for Python powered by V8 and Rust."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_pydeno"            # Python import name
crate-type = ["cdylib", "rlib"] # rlib so benches/ can link the crate directly

[dependencies]
anyhow = "1.0"
deno_core = "0.412.0"
deno_error = "0.7.0"
fastwebsockets = { version = "0.10.0", features = ["upgrade", "unstable-split"], optional = true }
futures = "0.3"
http = { version = "1.3", optional = true }
http-body-util = { version = "0.1.3", optional = true }
hyper = { version = "1.6.0", default-features = false, features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1.10", default-features = false, features = ["tokio"], optional = true }
indexmap = { version = "2.14", features = ["serde"] }
log = "0.4.28"
num-bigint = { version = "0.4", features = ["serde"] }
# extension-module is enabled by maturin (see pyproject.toml [tool.maturin]),
# not here, so the "bench" feature can enable auto-initialize instead for benches/.
pyo3 = { version = "0.29", features = ["num-bigint"] }
pyo3-async-runtimes = { version = "0.29", features = ["attributes", "tokio-runtime"] }
# Already in the tree (via deno_core); the source scanner's name lookups.
rustc-hash = "2.1"
serde ={ version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt", "macros", "time", "sync"] }
uuid = { version = "1.27", features = ["v4"] }

# deno_core 0.412 (Deno 2.9.7, the newest release) is built for V8 150.4 and its deno_v8 facade
# pins rusty_v8 ^150.4. The facade is a re-export only, so it is vendored here with the pin
# moved to the newest V8 (152.2); drop this patch once a deno_core release ships a newer V8.
[patch.crates-io]
deno_v8 = { path = "vendor/deno_v8" }
deno_core = { path = "vendor/deno_core" }

[build-dependencies]
pyo3-build-config = "0.29"

[dev-dependencies]
criterion = "0.8"

[features]
default = ["inspector"]
# The Chrome DevTools inspector server (src/runtime/inspector/server.rs): an
# HTTP/WebSocket listener and its network crates. On for the normal wheel; a
# build with `--no-default-features` drops it, and RuntimeConfig(inspector=...)
# then fails with "built without inspector support".
inspector = [
  "dep:fastwebsockets",
  "dep:http",
  "dep:http-body-util",
  "dep:hyper",
  "dep:hyper-util",
  "tokio/net",
]
# auto-initialize embeds a Python interpreter for the Criterion benches, since
# extension-module (used for the real wheel) forbids Python::with_gil.
bench = ["pyo3/auto-initialize"]

[[bench]]
name = "runtime_benches"
harness = false
required-features = ["bench"]

# Overflow checks stay ON for pydeno's own code -- they are worth having -- but
# are turned off for third-party crates in unoptimized builds.
#
# `deno_core` 0.412.0 `source_map.rs:221` (0.409.0: `:105`) computes
# `line_number - 1` on a u32 that it documents as 1-based, and V8 reports
# line/column 0 for some syntax errors. So `rt.eval("`\\")` -- an unterminated
# template literal -- panics with "attempt to subtract with overflow" inside
# `JsError::from_v8_exception`, killing the runtime thread and turning a
# catchable `JavaScriptError` into `RuntimeError: Failed to receive eval
# result`. pydeno cannot fix that arithmetic, and the release build users
# actually get wraps instead of panicking, so a debug-only panic in a
# dependency is not a bug this project can act on -- it just makes the debug
# test suite unrunnable. Pinned by
# `tests/test_thread_stack_size.py::test_a_zero_column_syntax_error_does_not_kill_the_runtime_thread`;
# re-check it on every `deno_core` bump.
#
# Scoped to `package."*"`, which in Cargo means dependencies and *not* the
# local crate, so an overflow in pydeno's own arithmetic still panics loudly.
# Remove both sections once `deno_core` is bumped past the fix.
[profile.dev.package."*"]
overflow-checks = false

[profile.test.package."*"]
overflow-checks = false

# Wheel build: fat LTO + one codegen unit + stripped symbols. V8 itself is a
# prebuilt static lib, so this shrinks/speeds only the Rust glue and deno_core.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
