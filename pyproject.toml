[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "pydeno"
requires-python = ">=3.10"
description = "Modern embedded JavaScript runtime for Python powered by V8 and Rust."
readme = "README.md"
license = 'MIT'
authors = [{ name = "Xin Fu", email = "xin@imfing.com" }]
maintainers = [{ name = "BMSuisse", email = "dominik.peter@bmsuisse.ch" }]
keywords = ["javascript", "v8", "pyo3", "asyncio", "rust-extension"]
classifiers = [
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
  'Operating System :: MacOS',
  'Operating System :: POSIX :: Linux',
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]

[project.optional-dependencies]
# `pydeno.integrations.pydantic_ai` (JSCodeMode); plain pydeno has no runtime dependencies.
pydantic-ai = ["pydantic-ai-slim>=2.46,<3"]

[project.scripts]
# `pydeno 'expr'`: evaluate JavaScript in a sandboxed worker (`pydeno._cli`).
pydeno = "pydeno._cli:main"

[project.urls]
Homepage = "https://github.com/bmsuisse/pydeno"
Repository = "https://github.com/bmsuisse/pydeno"

[dependency-groups]
dev = ["maturin"]
testing = [
  { include-group = "dev" },
  "pytest>=8.4.0",
  "pytest-asyncio>=1.2.0",
  "hypothesis>=6.100.0",
  "pydantic-monty>=1.0",
  "pydantic-ai-slim>=2.0",
]
benchmarking = [{ include-group = "dev" }, "pytest-benchmark>=4.0.0"]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.6.0",
  "mkdocstrings[python]>=0.28.0",
]
examples = ["pydantic-ai>=0.0.1", "fastmcp>=2.0.0", "python-pptx>=1.0.0"]
all = [
  { include-group = "dev" },
  { include-group = 'testing' },
  { include-group = 'benchmarking' },
  { include-group = 'docs' },
  { include-group = 'examples' },
]

[tool.maturin]
features = ["pyo3/extension-module"]
strip = true
module-name = "pydeno._pydeno"
python-source = "python"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "linux_only: needs Linux (seccomp, Landlock, abstract sockets); deselected, not skipped, elsewhere",
    "darwin_only: needs macOS (Seatbelt); deselected, not skipped, elsewhere",
    "full_sandbox: asserts every dangerous operation is denied; deselected where PYDENO_EXPECT_SANDBOX names a degraded set of layers",
    "redteam: fires real privileged syscalls from a sandboxed process; deselected unless PYDENO_REDTEAM_CONTAINER=1 and seccomp is expected",
    "as_root: only meaningful when the tests run as root (a container); deselected otherwise",
    "needs_monty: pairs pydeno with pydantic-monty; deselected where it is not installed",
    "needs_pydantic_ai: exercises the pydantic-ai integration; deselected where pydantic-ai is not installed",
]
