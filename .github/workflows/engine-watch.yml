name: Engine watch

# V8 security fixes reach pydeno only through `deno_core`. This fails (and so notifies) when a
# newer `deno_core` carries a higher V8 than Cargo.lock does, which is the cue to upgrade.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_engine.py
