name: Tests

# The first workflow in this repo that actually runs the test suite. Before
# this, `.github/workflows/` held only publish-on-release, benchmarks and
# docs, so every "the tests pass" claim was local and unverified.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # A `>=` floor on the collected test count, not an equality check: adding
  # tests never needs a bump here, only deleting them does. This is the
  # assertion that makes a mass-skip fail the job -- see
  # `scripts/check_test_report.py` for the full rationale.
  MIN_PYTHON_TESTS: "700"
  # Skips are unverified tests, so the budget is zero. The suite has exactly
  # one conditional skip (`tests/test_idle_cpu.py`, skipped above 16 CPUs) and
  # GitHub's macOS runners are well under that, so zero is correct here. Every
  # skip is printed with its reason regardless, so a new one is visible before
  # anyone tolerates it.
  MAX_SKIPPED: "0"
  # Deliberate expected failures, kept out of the skip budget: the in-process
  # `Runtime` cannot contain these native-builtin crashes and hangs (they are
  # contained by `IsolatedRuntime`, see `tests/test_monty_parity_security.py`),
  # plus two off-heap memory sinks. Ten is the exact current count; a new xfail
  # is a decision and should raise this in the same commit.
  MAX_XFAILED: "10"
  CARGO_TERM_COLOR: always

jobs:
  # Debug and release are separate jobs on purpose. The library's headline
  # invariant -- guest JS gets a result or a catchable exception, never a host
  # crash -- silently depended on `-O` shrinking the recursive serializer's
  # stack frames: `rt.eval("[" * 80 + "]" * 80)` killed the process on a debug
  # build and was refused cleanly on a release build. A release-only CI job
  # cannot see that class of bug at all.
  pytest:
    name: pytest (${{ matrix.profile }})
    timeout-minutes: 45
    # macos-latest, matching `benchmarks.yml`: the Linux cdylib build currently
    # fails to link V8 (rust-lld TLS relocation vs `-shared`), a pre-existing
    # issue tracked separately. Moving these jobs to Linux is a follow-up, and
    # would want a `manylinux: 2_28` container -- the pinned `deno_core`'s V8
    # needs glibc >= 2.27.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            maturin_args: ""
          - profile: release
            maturin_args: "--release"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}

      - name: Build the extension (${{ matrix.profile }})
        run: |
          uv sync --frozen --group all
          uv run maturin develop --uv ${{ matrix.maturin_args }}

      # Collection is a separate step so a collection error (which removes
      # every test in the offending file) fails the job on its own exit code,
      # before anything has had a chance to look green.
      - name: Collect tests
        run: |
          uv run python scripts/collect_guard.py 180 tests/ --co -q \
            -p no:randomly --strict-markers --strict-config \
            | tee collect-${{ matrix.profile }}.log

      - name: Run pytest
        # `continue-on-error` is deliberate: a red suite must still reach the
        # report check below, which is what turns "the process died at test 46"
        # into a legible error instead of a bare exit code.
        continue-on-error: true
        id: pytest
        run: |
          uv run python -m pytest tests/ -v \
            -p no:randomly --strict-markers --strict-config \
            --junitxml=junit-${{ matrix.profile }}.xml

      - name: Check the test report for skipped or unrun tests
        run: |
          uv run python scripts/check_test_report.py \
            --label "pytest ${{ matrix.profile }}" \
            --junit junit-${{ matrix.profile }}.xml \
            --collect-log collect-${{ matrix.profile }}.log \
            --min-tests "$MIN_PYTHON_TESTS" \
            --max-skipped "$MAX_SKIPPED" \
            --max-xfailed "$MAX_XFAILED"

      - name: Fail if pytest itself failed
        if: steps.pytest.outcome != 'success'
        run: |
          echo "::error::pytest exited non-zero in the ${{ matrix.profile }} profile"
          exit 1

  # Closes the gap the `pytest` job's comment above states plainly:
  # `workflow.yaml` publishes `manylinux_2_28` wheels that no CI job ever
  # imported, let alone tested. This job builds that exact wheel (same
  # `manylinux: 2_28` as `workflow.yaml`) and actually installs + imports +
  # tests it on Linux, instead of resting every Linux claim on "the
  # container produced a wheel".
  pytest-linux-wheel:
    name: pytest (linux wheel)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-wheel

      - name: Build a manylinux_2_28 wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --find-interpreter
          manylinux: 2_28

      - name: Install the built wheel (not the editable dev build)
        run: |
          uv venv .wheel-venv
          # `--find-interpreter` builds one wheel per CPython minor found in
          # the manylinux container (cp310..cp313), so `dist/*.whl` expands to
          # several and `uv pip install` refuses them: "Requirements contain
          # conflicting URLs for package `pydeno`". Install only the wheel
          # whose ABI tag matches this venv's interpreter.
          PYTAG=$(.wheel-venv/bin/python -c \
            'import sys; print("cp%d%d" % sys.version_info[:2])')
          WHEEL=$(ls dist/*-${PYTAG}-${PYTAG}-*.whl)
          echo "Installing $WHEEL into a $PYTAG venv"
          uv pip install --python .wheel-venv/bin/python "$WHEEL"
          # Matches the `testing` dependency group in pyproject.toml -- the
          # test *runner's* deps, deliberately installed on top of the built
          # wheel rather than an editable `maturin develop` install.
          uv pip install --python .wheel-venv/bin/python \
            "pytest>=8.4.0" "pytest-asyncio>=1.2.0" "hypothesis>=6.100.0"

      # Same collection-first-then-run-then-check shape as the macOS jobs, so
      # a collection error or a mass-skip fails this job exactly as loudly.
      - name: Collect tests
        run: |
          .wheel-venv/bin/python scripts/collect_guard.py 180 tests/ --co -q \
            -p no:randomly --strict-markers --strict-config \
            | tee collect-linux-wheel.log

      - name: Run pytest against the installed wheel
        continue-on-error: true
        id: pytest
        run: |
          .wheel-venv/bin/python -m pytest tests/ -v \
            -p no:randomly --strict-markers --strict-config \
            --junitxml=junit-linux-wheel.xml

      - name: Check the test report for skipped or unrun tests
        run: |
          .wheel-venv/bin/python scripts/check_test_report.py \
            --label "pytest linux-wheel" \
            --junit junit-linux-wheel.xml \
            --collect-log collect-linux-wheel.log \
            --min-tests "$MIN_PYTHON_TESTS" \
            --max-skipped "$MAX_SKIPPED" \
            --max-xfailed "$MAX_XFAILED"

      - name: Fail if pytest itself failed
        if: steps.pytest.outcome != 'success'
        run: |
          echo "::error::pytest exited non-zero against the installed linux wheel"
          exit 1

  # The isolation layers are kernel features (seccomp, Landlock) whose behaviour depends on
  # the architecture (the filter hard-codes syscall numbers per arch), the kernel, and
  # whatever the container runtime does around them. None of that can be trusted from one
  # developer machine, so build the wheel natively on each architecture and run the
  # isolation, red-team and escape suites inside many distro images on real kernels.
  linux-wheels:
    name: build wheels (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Build manylinux_2_28 wheels (every CPython the container has)
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --find-interpreter
          manylinux: 2_28

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  linux-matrix:
    name: ${{ matrix.image }} / ${{ matrix.profile }} (${{ matrix.arch }})
    needs: linux-wheels
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CONTAINER_RUNTIME: docker
      # A host AppArmor profile must not decide which sandbox layers apply.
      EXTRA_RUN_ARGS: --security-opt apparmor=unconfined
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        profile: [default]
        image:
          - python:3.10-slim
          - python:3.11-slim
          - python:3.12-slim
          - python:3.13-slim
          - python:3.14-slim
          - debian:bookworm
          - debian:trixie
          - ubuntu:22.04
          - ubuntu:24.04
          - fedora:latest
          - almalinux:9
          - amazonlinux:2023
        include:
          - {arch: x86_64, runner: ubuntu-latest}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
          # Kernels that lack a feature: the sandbox must degrade, never crash, and
          # `sandbox="require"` must refuse to start. Two images are enough; the kernel
          # feature is what varies.
          - {arch: x86_64, runner: ubuntu-latest, image: "ubuntu:24.04", profile: no-landlock}
          - {arch: x86_64, runner: ubuntu-latest, image: "ubuntu:24.04", profile: no-seccomp}
          - {arch: x86_64, runner: ubuntu-latest, image: "ubuntu:24.04", profile: none}
          - {arch: aarch64, runner: ubuntu-24.04-arm, image: "ubuntu:24.04", profile: no-landlock}
          - {arch: aarch64, runner: ubuntu-24.04-arm, image: "ubuntu:24.04", profile: no-seccomp}
          - {arch: aarch64, runner: ubuntu-24.04-arm, image: "ubuntu:24.04", profile: none}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.arch }}
          path: wheels

      - name: Isolation, red-team and escape suites in ${{ matrix.image }}
        run: scripts/linux_matrix.sh wheels "${{ matrix.image }}" "${{ matrix.profile }}"

  # The strict-xfail probes (in-process crashes that IsolatedRuntime contains) take minutes
  # and do not depend on the kernel, so they run in one cell per architecture.
  linux-parity-xfails:
    name: monty-parity xfails (${{ matrix.arch }})
    needs: linux-wheels
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CONTAINER_RUNTIME: docker
      EXTRA_RUN_ARGS: --security-opt apparmor=unconfined
      PYTEST_TARGETS: tests/test_monty_parity_security.py
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-latest}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.arch }}
          path: wheels
      - run: scripts/linux_matrix.sh wheels python:3.13-slim default

  cargo-test:
    name: cargo test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      # `--test-threads=1` is this repo's convention: several tests share
      # process-global V8 platform state, and the Rust suite is not safe to
      # interleave.
      - name: cargo test
        run: cargo test --release --features bench -- --test-threads=1

  lint:
    name: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --tests -- -D warnings

      # Pinned. `uv tool run ruff` resolves the newest release at job time, so
      # an unpinned lint step turns every upstream ruff release into a red
      # build that nobody in this repo caused: 0.16 widened the default rule
      # selection and reports 248 findings (I001, PYI048, PIE790, SIM117, ...)
      # against `main` @ 400e3cb, none of them regressions. Bumping the pin is
      # then a deliberate commit that clears the new rules, which is what a
      # lint gate is for.
      - name: ruff check
        run: uv tool run ruff@0.15.10 check python/pydeno tests scripts

      - name: ruff format
        run: uv tool run ruff@0.15.10 format --check python/pydeno tests scripts
