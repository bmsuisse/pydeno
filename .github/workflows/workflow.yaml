name: Publish to PyPI

# Publishing requires a GitHub Release. PRs and manual runs validate without publishing.
# Actually publishing requires PyPI Trusted Publishing to be configured for
# this exact repo + workflow on the PyPI project page first (see README).
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/workflow.yaml"
      - "scripts/linux_matrix.sh"
      - "scripts/check_test_report.py"

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  linux:
    # Native runner per arch: cross-compiling V8 is fragile, so aarch64 builds
    # (and is tested) on GitHub's ARM runner rather than under QEMU.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Build manylinux wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --find-interpreter
          # v8 >=150.1 (pulled in via deno_core >=0.409, see Cargo.toml) needs
          # glibc's memfd_create (glibc >=2.27), which manylinux2014's glibc
          # 2.17 lacks ("auto" resolved to manylinux2014 and the resulting
          # wheel failed to import: "undefined symbol: memfd_create").
          # manylinux_2_28 ships glibc 2.28.
          manylinux: 2_28
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --locked --out dist --find-interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: dist
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --locked --out dist --find-interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  # `test.yml`'s `pytest-linux-wheel` job runs this same check on every
  # push/PR, but a `needs:` dependency only works within one workflow file,
  # so a release can't lean on that job directly. This job re-runs the same
  # gate -- install the manylinux_2_28 wheel this release is about to
  # publish and actually `import`+test it -- against the artifact the
  # `linux` job above just built, so `publish` cannot ship a wheel that was
  # never installed anywhere.
  test-linux-wheel:
    name: Release wheel / ${{ matrix.target }} / Python ${{ matrix.python }}
    needs: [linux]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
      - name: Install the exact release wheel
        shell: bash
        run: |
          uv venv --python "${{ matrix.python }}" .wheel-venv
          PYTAG=$(.wheel-venv/bin/python -c 'import sys; print("cp%d%d" % sys.version_info[:2])')
          shopt -s nullglob
          wheels=(dist/*-"${PYTAG}"-"${PYTAG}"-*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one $PYTAG release wheel, found ${#wheels[@]}"
            exit 1
          fi
          sha256sum "${wheels[0]}" | tee wheel-sha256.txt
          git rev-parse HEAD | tee source-commit.txt
          uv pip install --python .wheel-venv/bin/python "${wheels[0]}" \
            "pytest>=8.4.0" "pytest-asyncio>=1.2.0" "hypothesis>=6.100.0"
          .wheel-venv/bin/python -I -c 'import pydeno; print("Installed artifact:", pydeno.__file__)'
      - name: Collect the release suite
        shell: bash
        run: |
          .wheel-venv/bin/python scripts/collect_guard.py 180 tests/ --co -q \
            -p no:randomly --strict-markers --strict-config | tee collect.log
      - name: Test the installed artifact
        id: pytest
        continue-on-error: true
        run: |
          .wheel-venv/bin/python -m pytest tests/ -q \
            -p no:randomly --strict-markers --strict-config --junitxml=junit.xml
      - name: Require complete results and no unexpected skips
        if: always()
        run: |
          .wheel-venv/bin/python scripts/check_test_report.py \
            --label "release ${{ matrix.target }} Python ${{ matrix.python }}" \
            --collect-log collect.log --junit junit.xml \
            --min-tests 700 --max-skipped 0 --max-xfailed 10
      - name: Require zero hostile-guest probe violations
        if: matrix.python == '3.12'
        shell: bash
        run: |
          .wheel-venv/bin/python scripts/autoresearch/metric_security.py | tee security-metric.log
          # The metric tool deliberately exits zero even when it reports violations.
          # Require exactly one metric line and a zero value, not merely exit status.
          test "$(grep '^METRIC:' security-metric.log)" = 'METRIC: 0'
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-tests-${{ matrix.target }}-py${{ matrix.python }}
          path: |
            collect.log
            junit.xml
            wheel-sha256.txt
            source-commit.txt
            security-metric.log
          if-no-files-found: error
      - name: Require pytest success
        if: always() && steps.pytest.outcome != 'success'
        run: exit 1

  test-linux-containment:
    name: Release containment / ${{ matrix.target }} / ${{ matrix.profile }}
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        profile: [default, no-landlock, no-seccomp, none]
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: aarch64
            runner: ubuntu-24.04-arm
    env:
      CONTAINER_RUNTIME: docker
      EXTRA_RUN_ARGS: --security-opt apparmor=unconfined
      KEEP_OUT: "1"
      MIN_TESTS: "500"
      # The installed artifact must be tested as published, never a Python source overlay.
      OVERLAY_PY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: wheels
      - name: Test containment and fail-closed behavior
        env:
          OUT_DIR: ${{ runner.temp }}/release-containment
        run: |
          # Root-only hardening/capability tests must run too: the native wheel jobs run
          # as an ordinary runner user. The default container runs the complete suite,
          # automatically including new security regressions as they land.
          if [ "${{ matrix.profile }}" = default ]; then
            export PYTEST_TARGETS=tests/
          fi
          scripts/linux_matrix.sh wheels python:3.12-slim "${{ matrix.profile }}"
      - name: Preserve containment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-containment-${{ matrix.target }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/release-containment
          if-no-files-found: error

  publish:
    name: Publish to PyPI (Trusted Publishing)
    if: github.event_name == 'release'
    needs: [linux, macos, windows, sdist, test-linux-wheel, test-linux-containment]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pydeno
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC) -- no API token secret needed
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
